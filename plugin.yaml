# runners-gate — the gate between Bridex agents and Cloud Run Jobs workers.
# kind MUST stay "integration": the gate needs HTTP routes (the worker
# callback) and agent wakeups, which only in-process plugins have — a catalog
# install of kind "tool" would run out-of-process and silently lose both.
name: runners-gate
version: 0.1.0
kind: integration
description: Submit heavy operations to Cloud Run Jobs workers and wake the requesting agent on completion — HMAC callback for speed, execution polling for truth. Multiple runners route by operation name.
entry: index.mjs
requires_env:
  - RUNNERS_GATE_CALLBACK_SECRET   # shared HMAC secret with the worker images
